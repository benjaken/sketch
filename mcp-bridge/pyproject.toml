[project]
name = "sketchup-mcp-bridge"
version = "0.1.0"
description = "Robust MCP server for SketchUp Pro 2026 (Windows host) driven from Claude Code in WSL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp[cli]>=1.3.0,<2"]

[project.scripts]
sketchup-mcp-bridge = "sketchup_mcp_bridge.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = ["pytest>=8.0"]
